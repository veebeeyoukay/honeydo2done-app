<div class="mb-2">
<h1 class="text-white tracking-tight text-[32px] font-bold leading-tight text-center font-display">
                        Who does your honey-do list go to?
                    </h1>
</div>
<!-- Abstract Illustration -->
<div class="py-8 flex justify-center">
<div class="connection-graphic" data-alt="Abstract glowing circles representing partnership connection">
<div class="circle-gold"></div>
<div class="circle-teal"></div>

<span class="material-symbols-outlined text-white/40 text-4xl">favorite</span>
</div>
</div>
</div>

<div class="flex flex-col gap-4">

<div class="flex flex-col gap-2">
<label class="flex flex-col flex-1">
<p class="text-white/80 text-sm font-medium leading-normal pb-1 px-1">Their name</p>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/10 bg-surface-dark focus:border-primary h-14 placeholder:text-white/30 px-4 text-base font-normal" placeholder="Enter partner's name" type="text"/>
</label>
</div>

<label class="flex flex-col flex-1">
<p class="text-white/80 text-sm font-medium leading-normal pb-1 px-1">Their email</p>
<input class="form-input flex w-full min-w-0 flex-1 rounded-xl text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-white/10 bg-surface-dark focus:border-primary h-14 placeholder:text-white/30 px-4 text-base font-normal" placeholder="Enter partner's email" type="email"/>

<button class="text-white/60 hover:text-white text-base font-medium transition-colors underline underline-offset-4 decoration-white/20 hover:decoration-white">

<div class="flex items-center justify-center gap-2 text-white/20 select-none">

</div>
