<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Task Completion Celebration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f5a524",
                        "accent-teal": "#4ECDC4",
                        "background-light": "#f8f7f5",
                        "background-dark": "#0D0D0D",
                        "card-dark": "#1A1A1A",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ambient-glow {
            background: radial-gradient(circle at top, rgba(78, 205, 196, 0.15) 0%, transparent 70%);
        }
        .confetti-overlay {
            background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-white min-h-screen relative overflow-x-hidden">
<div class="fixed inset-0 ambient-glow pointer-events-none"></div>
<div class="fixed inset-0 confetti-overlay opacity-30 pointer-events-none"></div>
<div class="layout-container flex h-full grow flex-col relative z-10">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-white/10 px-6 py-4 md:px-40">
<div class="flex items-center gap-4 text-white">
<div class="size-6 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_6_319)">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z" fill="currentColor"></path>
</g>
<defs>
<clipPath id="clip0_6_319"><rect fill="white" height="48" width="48"></rect></clipPath>
</defs>
</svg>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em]">HoneyDo2Done</h2>
</div>
<div class="flex gap-4">
<button class="flex items-center justify-center rounded-xl size-10 bg-white/5 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white">notifications</span>
</button>
<button class="flex items-center justify-center rounded-xl size-10 bg-white/5 hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-white">person</span>
</button>
</div>
</header>
<main class="flex flex-1 justify-center py-12 px-6">
<div class="layout-content-container flex flex-col max-w-[640px] flex-1 space-y-3">
<div class="text-center pt-6 pb-4">
<h1 class="text-white tracking-tight text-[48px] font-bold leading-tight">Nice work!</h1>
<p class="text-white/80 text-lg font-normal">One more off the list.</p>
</div>
<div class="p-4 bg-card-dark border border-white/5 shadow-2xl rounded-xl relative overflow-hidden">
<div class="flex flex-col items-center justify-center py-8">
<div class="mb-6 flex items-center justify-center size-20 rounded-full bg-accent-teal/10 border border-accent-teal/30">
<span class="material-symbols-outlined text-accent-teal text-5xl">check_circle</span>
</div>
<div class="text-center flex flex-col items-center gap-2">
<p class="text-accent-teal text-xs font-normal uppercase tracking-widest">Completed</p>
<h2 class="text-white text-2xl font-bold leading-tight tracking-tight">Kitchen faucet dripping</h2>
<p class="text-white/60 text-base font-normal">Completed in 3 days</p>
</div>
</div>
<div class="absolute -right-10 -bottom-10 size-40 bg-accent-teal/5 rounded-full blur-3xl"></div>
</div>
<div class="p-4 bg-transparent">
<div class="space-y-4">
<h3 class="text-white text-lg font-normal leading-tight tracking-tight">Want to tell Jen about it?</h3>
<div class="flex flex-col gap-4">
<label class="flex flex-col flex-1">
<textarea class="form-input flex w-full resize-none overflow-hidden rounded-xl text-white focus:outline-0 focus:ring-1 focus:ring-primary/50 border border-white/10 bg-card-dark placeholder:text-white/30 p-4 text-base font-normal leading-normal min-h-[120px]" placeholder="Add a completion note (e.g., 'All fixed and tested!')"></textarea>
</label>
<button class="flex items-center gap-2 px-4 py-2 self-start rounded-lg bg-white/5 border border-white/10 text-white text-sm font-normal hover:bg-white/10 transition-all">
<span class="material-symbols-outlined text-sm">photo_camera</span>
                                Add photo
                            </button>
</div>
</div>
</div>
<div class="flex flex-col gap-3 pt-4">
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-14 bg-primary text-background-dark text-lg font-normal leading-normal transition-transform active:scale-95 shadow-lg shadow-primary/20">
<span class="truncate">Send update</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-14 border border-white/20 bg-transparent text-white text-base font-normal leading-normal hover:bg-white/5 transition-all">
<span class="truncate">Just mark it done</span>
</button>
</div>
<p class="text-center text-white/40 text-xs mt-16 mb-8 font-normal">
                    HoneyDo2Done • Helping homes stay happy
                </p>
</div>
</main>
</div>

</body></html>
