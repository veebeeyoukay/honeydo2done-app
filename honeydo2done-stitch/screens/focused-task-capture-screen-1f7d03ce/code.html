<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spacious Voice Capture | HoneyDo2Done</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#F5A623",
                        "background-dark": "#0A0A0A",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "pill": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        @keyframes pulse-ring-1 {
            0% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 0.1; }
            100% { transform: scale(1); opacity: 0.4; }
        }
        @keyframes pulse-ring-2 {
            0% { transform: scale(1.1); opacity: 0.2; }
            50% { transform: scale(1.3); opacity: 0.05; }
            100% { transform: scale(1.1); opacity: 0.2; }
        }
        @keyframes pulse-ring-3 {
            0% { transform: scale(1.2); opacity: 0.1; }
            50% { transform: scale(1.5); opacity: 0.02; }
            100% { transform: scale(1.2); opacity: 0.1; }
        }
        .animate-pulse-1 { animation: pulse-ring-1 5s ease-in-out infinite; }
        .animate-pulse-2 { animation: pulse-ring-2 7s ease-in-out infinite; }
        .animate-pulse-3 { animation: pulse-ring-3 9s ease-in-out infinite; }
        .glow-effect {
            box-shadow: 0 0 50px 10px rgba(245, 166, 35, 0.2), inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }
        .pill-tactile {
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.6),
                0 4px 12px rgba(0, 0, 0, 0.5),
                0 1px 2px rgba(255, 255, 255, 0.08);
        }
        .soft-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bg-radial-focus {
            background: radial-gradient(circle at center, #1e1e1e 0%, #0a0a0a 75%, #050505 100%);
        }.accessible-placeholder::placeholder {
            color: rgba(255, 255, 255, 0.65) !important;
            opacity: 1;
        }
    </style>
</head>
<body class="font-display text-white selection:bg-primary/30 overflow-hidden bg-background-dark">
<div class="relative flex h-screen w-full flex-col bg-radial-focus">
<header class="flex items-center justify-between px-8 py-8 md:px-12 z-20">
<button aria-label="Close" class="group flex h-12 w-12 items-center justify-center rounded-full bg-white/10 text-white/60 hover:bg-white/20 hover:text-white soft-transition pill-tactile">
<span class="material-symbols-outlined font-light text-2xl">close</span>
</button>
<div class="flex items-center gap-2 opacity-40">
<div class="size-5 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M8.57829 8.57829C5.52816 11.6284 3.451 15.5145 2.60947 19.7452C1.76794 23.9758 2.19984 28.361 3.85056 32.3462C5.50128 36.3314 8.29667 39.7376 11.8832 42.134C15.4698 44.5305 19.6865 45.8096 24 45.8096C28.3135 45.8096 32.5302 44.5305 36.1168 42.134C39.7033 39.7375 42.4987 36.3314 44.1494 32.3462C45.8002 28.361 46.2321 23.9758 45.3905 19.7452C44.549 15.5145 42.4718 11.6284 39.4217 8.57829L24 24L8.57829 8.57829Z" fill="currentColor"></path>
</svg>
</div>
<span class="text-[10px] font-bold tracking-[0.3em] uppercase">HoneyDo2Done</span>
</div>
<div class="w-12"></div>
</header>
<main class="flex flex-1 flex-col items-center justify-center px-4 relative z-10">
<div class="mb-24">
<h1 class="text-4xl font-light tracking-tight text-white md:text-5xl text-center">
                What's going on?
            </h1>
</div>
<div class="flex flex-col items-center">
<div class="relative flex items-center justify-center">
<div class="absolute size-[520px] rounded-full border border-primary/5 bg-primary/[0.01] animate-pulse-3"></div>
<div class="absolute size-[400px] rounded-full border border-primary/10 bg-primary/[0.02] animate-pulse-2"></div>
<div class="absolute size-[320px] rounded-full border border-primary/20 bg-primary/[0.03] animate-pulse-1"></div>
<div class="relative group">
<button aria-label="Start voice recording" class="glow-effect flex h-60 w-60 cursor-pointer items-center justify-center rounded-full bg-primary text-background-dark soft-transition hover:scale-[1.02] active:scale-95 z-10 focus:outline-none focus:ring-4 focus:ring-primary/40">
<span class="material-symbols-outlined text-7xl">mic</span>
</button>
</div>
</div>
<p class="mt-20 text-center text-[10px] font-bold tracking-[0.6em] text-white/60 uppercase">
                tap to speak
            </p>
<div class="flex items-center gap-12 mt-28">
<div class="flex flex-col items-center gap-4 group">
<button aria-label="Capture photo" class="pill-tactile flex h-14 w-28 items-center justify-center rounded-full border border-white/10 bg-white/[0.05] text-white/50 hover:border-white/30 hover:bg-white/[0.1] hover:text-white soft-transition focus:outline-none focus:ring-2 focus:ring-white/20">
<span class="material-symbols-outlined text-2xl font-light">photo_camera</span>
</button>
<span class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] group-hover:text-white/70 soft-transition">Capture</span>
</div>
<div class="flex flex-col items-center gap-4 group">
<button aria-label="Switch to keyboard input" class="pill-tactile flex h-14 w-28 items-center justify-center rounded-full border border-white/10 bg-white/[0.05] text-white/50 hover:border-white/30 hover:bg-white/[0.1] hover:text-white soft-transition focus:outline-none focus:ring-2 focus:ring-white/20">
<span class="material-symbols-outlined text-2xl font-light">keyboard</span>
</button>
<span class="text-[10px] font-bold text-white/40 uppercase tracking-[0.2em] group-hover:text-white/70 soft-transition">Text Mode</span>
</div>
</div>
</div>
</main>
<footer class="flex w-full flex-col items-center justify-end pb-12 px-4 z-20">
<div class="w-full max-w-md">
<div class="relative">
<label class="sr-only" for="task-input">Quick input</label>
<input class="form-input pill-tactile accessible-placeholder flex w-full items-center justify-center rounded-full border border-white/10 bg-white/[0.04] px-8 py-5 text-center text-base font-light text-white placeholder:text-white/60 focus:border-primary/40 focus:bg-white/[0.08] focus:outline-none focus:ring-0 soft-transition" id="task-input" placeholder="or type here..." type="text"/>
</div>
</div>
<p class="mt-8 text-[10px] font-semibold text-white/30 tracking-[0.4em] uppercase">
            Therapeutic Capture Mode Active
        </p>
</footer>
<div class="pointer-events-none absolute -bottom-1/3 -left-1/4 size-[800px] rounded-full bg-primary/[0.02] blur-[140px]"></div>
<div class="pointer-events-none absolute -top-1/3 -right-1/4 size-[800px] rounded-full bg-primary/[0.02] blur-[140px]"></div>
</div>

</body></html>
