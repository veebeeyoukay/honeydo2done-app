<script id="tailwind-config">

            theme: {
                extend: {
                    colors: {
                        "primary": "#f5a524",
                        "background-light": "#f8f7f5",
                        "background-dark": "#0D0D0D",
                        "card-dark": "#1A1A1A",

                    fontFamily: {
                        "display": ["Inter", "sans-serif"]

                    borderRadius: {

<div class="relative">

<span class="text-[10px] text-gray-500 font-bold uppercase">Stressed</span>
</button>
<button class="group flex flex-col items-center gap-2">

<span class="text-[10px] text-gray-500 font-bold uppercase">Anxious</span>
</button>
<button class="group flex flex-col items-center gap-2">
<div class="h-10 w-10 rounded-full bg-blue-500/60 border-2 border-blue-400 group-hover:bg-blue-500/80 transition-all scale-110 ring-4 ring-blue-500/20"></div>

</button>

<div class="h-10 w-10 rounded-full bg-green-500/20 border-2 border-green-500/40 group-hover:bg-green-500/40 transition-all scale-100 group-hover:scale-110"></div>
