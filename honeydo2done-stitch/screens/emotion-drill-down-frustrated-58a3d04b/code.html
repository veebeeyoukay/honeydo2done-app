<script id="tailwind-config">

            darkMode: "class",

        .bg-coral-glow {
            background: radial-gradient(circle at top center, rgba(255, 71, 71, 0.18) 0%, rgba(13, 13, 13, 0) 70%);
        }.constellation-word {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }.depth-1 { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); transform: translateZ(30px); }
        .depth-2 { filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); transform: translateZ(50px); }
        .depth-3 { filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); transform: translateZ(80px); }
        .constellation-word:hover {
            transform: scale(1.1) translateZ(100px) !important;
            filter: brightness(1.2) drop-shadow(0 20px 30px currentColor);
        }
        .glossy-finish {
            background: linear-gradient(135deg, #F5A623 0%, #FFC15E 45%, #F5A623 50%, #D48806 100%);

            position: relative;
            overflow: hidden;
        }
        .glossy-finish::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }
        .card-glow {
